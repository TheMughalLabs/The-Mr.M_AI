<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf5">
<title>Link Finder (Live)</title>
<style>
:root{--bg:#f4f3ff;--card:#fff;--text:#1d1b3a;--muted:#6b6a8a;--accent:#6c4cf5;--accent2:#22c1c3;--border:#e3e0fb}
@media (prefers-color-scheme:dark){:root{--bg:#0f0e1d;--card:#1a1930;--text:#ecebff;--muted:#9c9bc0;--accent:#8c73ff;--accent2:#2fd4d6;--border:#2d2b4d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 56px}
.hero{text-align:center;margin-bottom:22px}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(108,76,245,.35)}
h1{margin:0;font-size:2.1rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:6px 0 0}
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(80,60,200,.08)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,76,245,.18)}
.field{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:12px;font-size:.95rem;font-weight:600;padding:12px 18px;font-family:inherit;transition:.2s}
.go{flex:1;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.go:disabled{opacity:.6;cursor:wait}
.ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
#status{margin:18px 0 6px;font-size:.88rem;color:var(--muted);text-align:center;min-height:20px}
.bar{height:5px;border-radius:9px;background:var(--border);overflow:hidden;margin-top:8px;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.grp{margin-top:20px}
.grp h2{margin:0 0 8px;font-size:1rem;display:flex;align-items:center;gap:8px}
.grp h2 span{font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--card);border:1px solid var(--border);color:var(--accent)}
.item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.t{font-weight:600;font-size:.95rem;margin-bottom:3px}
.s{color:var(--muted);font-size:.84rem;margin-bottom:6px}
.u{display:block;color:var(--accent);font-size:.8rem;word-break:break-all;margin-bottom:8px;text-decoration:none}
.btns{display:flex;gap:6px;align-items:center}
.btns a,.btns button{font-size:.78rem;padding:6px 12px;border-radius:9px;text-decoration:none}
.open{background:var(--accent);color:#fff}
.src{margin-left:auto;font-size:.7rem;color:var(--muted)}
.msg{padding:14px;border-radius:12px;background:var(--card);border:1px dashed var(--border);color:var(--muted);text-align:center;margin-top:16px;white-space:pre-line}
.tools{margin-top:22px;display:none}
html{-webkit-text-size-adjust:100%}
button,a{-webkit-tap-highlight-color:transparent}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;padding:0;font-size:1.5rem;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(108,76,245,.5);display:none;z-index:9}
.fab:disabled{opacity:.6}
.fab.spinning{animation:r .8s linear infinite}
@media(max-width:560px){
  .wrap{padding:18px 12px 96px}
  h1{font-size:1.7rem}
  button,input,select{min-height:48px}
  .btns a,.btns button{min-height:40px;display:inline-flex;align-items:center}
  .btns{flex-wrap:wrap}
  .panel{padding:14px;border-radius:16px}
  .row>button{flex:1 1 40%}
}
.kind{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:6px}
.k-direct{background:#d9f7e8;color:#0a7a45}.k-category{background:#fff1d6;color:#9a5a00}
@media (prefers-color-scheme:dark){.k-direct{background:#103d2a;color:#5fe3a2}.k-category{background:#43320f;color:#ffc46b}}
.seg{display:flex;gap:6px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px 6px;background:transparent;color:var(--muted);font-size:.85rem}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo">🔗</div>
    <h1>Link Finder (Live)</h1>
    <p class="sub">Koi pehle se saved result nahi. Har baar internet par asli search hoti hai.</p>
    <p class="sub"><a href="#" id="cfg" style="color:inherit">⚙ Worker address badlein</a></p>
  </div>
  <div class="panel">
    <div class="field">
      <label>Kis cheez ka link chahiye?</label>
      <input id="what" placeholder="e.g. Tum Hi Ho Arijit Singh" autocomplete="off">
    </div>
    <div class="two">
      <div class="field">
        <label>Website URL (optional, ek se zyada comma se)</label>
        <input id="site" placeholder="e.g. site1.com, site2.com" autocomplete="off">
      </div>
      <div class="field">
        <label>Kahan dhoondna hai (khali website par)</label>
        <select id="cat">
          <option value="music">Song / Music (zyada jagah)</option>
          <option value="video">Video</option>
          <option value="code">Code / Software</option>
          <option value="all">Sirf general web</option>
        </select>
      </div>
    </div>
    <div class="two">
      <div class="field">
        <label>Kitne results chahiye</label>
        <select id="cnt"><option>20</option><option selected>50</option><option>100</option><option>200</option></select>
      </div>
      <div class="field">
        <label>YouTube ki tarteeb</label>
        <select id="sort"><option value="">Sab se munasib</option><option value="views">Sab se zyada views</option><option value="date">Sab se naye</option><option value="rating">Best rating</option></select>
      </div>
    </div>
    <div class="field">
      <label>Kis tarah ka link chahiye?</label>
      <div class="seg" id="seg">
        <button data-m="direct" class="on">🎯 Direct link</button>
        <button data-m="category">📂 Category</button>
        <button data-m="both">Dono</button>
      </div>
    </div>
    <div class="row">
      <button class="go" id="go">🔍 Dhoondo</button>
      <button class="ghost" id="refresh" title="Purane results hata kar sirf naye dikhao">🔄 Refresh (naye)</button>
      <button class="ghost" id="clr">Clear</button>
    </div>
  </div>
  <div id="status"></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div id="out"></div>
  <button class="fab" id="fab" title="Refresh: sirf naye results">🔄</button>
  <div class="tools row" id="tools">
    <button class="ghost" id="more">➕ Aur results</button>
    <button class="ghost" id="copyAll">📋 Saare links copy</button>
    <button class="ghost" id="saveAll">⬇️ .txt me save</button>
  </div>
</div>
<script>
var $ = function (i) { return document.getElementById(i); };
var API = '';
try { API = localStorage.getItem('lf_api') || ''; } catch (e) {}
function askApi() {
  var v = (prompt('Apne Cloudflare Worker ka address likhein\n(e.g. https://link-finder.aapka-naam.workers.dev)', API) || '').trim().replace(/\/+$/, '');
  if (v) { API = v; try { localStorage.setItem('lf_api', v); } catch (e) {} }
  return API;
}
if (!API) askApi();
var what = $('what'), site = $('site'), cat = $('cat'), go = $('go'), out = $('out'), statusEl = $('status');
var results = [], seen = {}, busy = false, mode = 'direct', q0 = '';
var CATS = {
  music: ['open.spotify.com', 'soundcloud.com', 'music.apple.com', 'jiosaavn.com', 'gaana.com', 'deezer.com', 'genius.com', 'audiomack.com'],
  video: ['dailymotion.com', 'vimeo.com', 'facebook.com', 'tiktok.com'],
  code: ['github.com', 'sourceforge.net', 'stackoverflow.com', 'npmjs.com', 'pypi.org'],
  all: []
};
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function safe(u) { try { var x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x : null; } catch (e) { return null; } }
function cleanSite(s) { return s.trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').split(/[\/?#]/)[0].toLowerCase(); }
function cleanSites(v) { var o = []; v.split(/[\s,;]+/).forEach(function (x) { x = cleanSite(x); if (x && o.indexOf(x) < 0) o.push(x); }); return o.join(','); }
function copyText(t, btn) {
  var done = function () { var o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(function () { btn.textContent = o; }, 1400); };
  var fb = function () { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); };
  try { navigator.clipboard.writeText(t).then(done, fb); } catch (e) { fb(); }
}
var ytNext = '';
async function api(type, q, s, page) {
  var extra = '';
  if (type === 'yt') extra = '&count=' + $('cnt').value + '&sort=' + $('sort').value + (page > 0 && ytNext ? '&token=' + encodeURIComponent(ytNext) : '');
  else if (type === 'crawl' || type === 'archive') extra = '&count=' + $('cnt').value;
  var r = await fetch(API + '/api/job?type=' + type + '&q=' + encodeURIComponent(q) + '&site=' + encodeURIComponent(s || '') + '&page=' + (page || 0) + extra + '&_=' + Date.now(), { cache: 'no-store' });
  var d = await r.json();
  if (d.error) throw new Error(d.error);
  if (type === 'yt') ytNext = d.next || '';
  return d.results;
}
function normKey(u) {
  try { var x = new URL(u); x.hash = ''; ['utm_source', 'utm_medium', 'utm_campaign', 'fbclid'].forEach(function (p) { x.searchParams.delete(p); });
    return x.hostname.replace(/^www\./, '').toLowerCase() + x.pathname.replace(/\/$/, '') + x.search; } catch (e) { return u; }
}
function hostOk(u, s) { try { var h = new URL(u).hostname.toLowerCase().replace(/^www\./, ''); s = s.toLowerCase(); return h === s || h.endsWith('.' + s); } catch (e) { return false; } }
function addResults(list) {
  list.forEach(function (r) { if (!safe(r.url)) return; if (last && last.s && !last.s.split(',').some(function (d) { return hostOk(r.url, d); })) return; var k = normKey(r.url); if (seen[k]) return; seen[k] = 1; results.push(r); });
  render();
}
function words() { return q0.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 1; }); }
function rank(r) { var h = (r.title + ' ' + r.url).toLowerCase(), n = 0; words().forEach(function (w) { if (h.indexOf(w) > -1) n++; }); return n + (r.kind === 'direct' ? 0.5 : 0); }
function visible() { return results.filter(function (r) { return mode === 'both' || r.kind === mode; }); }
function render() {
  var groups = {}, order = [];
  visible().sort(function (a, b) { return rank(b) - rank(a); }).forEach(function (r) {
    var d = new URL(r.url).hostname.replace(/^www\./, '');
    if (!groups[d]) { groups[d] = []; order.push(d); }
    groups[d].push(r);
  });
  order.sort(function (a, b) { return groups[b].length - groups[a].length; });
  out.innerHTML = '';
  order.forEach(function (d) {
    var g = el('div', 'grp'), h = el('h2', '', d); h.appendChild(el('span', '', groups[d].length + ' link' + (groups[d].length > 1 ? 's' : '')));
    g.appendChild(h);
    groups[d].forEach(function (r) {
      var c = el('div', 'item');
      var tt = el('div', 't'); tt.appendChild(el('span', 'kind k-' + r.kind, r.kind === 'direct' ? 'DIRECT' : 'CATEGORY')); tt.appendChild(document.createTextNode(r.title || r.url)); c.appendChild(tt);
      if (r.snippet) c.appendChild(el('div', 's', r.snippet.slice(0, 200)));
      var a = el('a', 'u', r.url); a.href = r.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; c.appendChild(a);
      var b = el('div', 'btns');
      var o = el('a', 'open', 'Open ↗'); o.href = r.url; o.target = '_blank'; o.rel = 'noopener noreferrer';
      var cp = el('button', 'ghost', 'Copy'); cp.onclick = function () { copyText(r.url, cp); };
      b.appendChild(o); b.appendChild(cp);
      if (navigator.share) { var sh = el('button', 'ghost', 'Share'); sh.onclick = function () { navigator.share({ title: r.title, url: r.url }).catch(function () {}); }; b.appendChild(sh); }
      b.appendChild(el('span', 'src', r.source));
      c.appendChild(b); g.appendChild(c);
    });
    out.appendChild(g);
  });
  var vis = visible().length, hidden = results.length - vis;
  $('tools').style.display = vis ? 'flex' : 'none';
  if (!busy && results.length) {
    var n = Object.keys(groups).length;
    statusEl.textContent = vis + ' links, ' + n + ' websites se.' + (hidden ? ' (' + hidden + ' ' + (mode === 'direct' ? 'category' : 'direct') + ' links chhupe hain, upar "Dono" chunein)' : '');
  }
  if (!busy && results.length) {
    var cnt = {}; results.forEach(function (r) { cnt[r.source] = (cnt[r.source] || 0) + 1; });
    out.appendChild(el('div', 'msg', 'Sources: ' + Object.keys(cnt).map(function (k) { return k + ' ' + cnt[k]; }).join(' · ')));
  }
  if (!busy && results.length && !vis) out.appendChild(el('div', 'msg', 'Is tarah ka koi link nahi mila. "Dono" ya doosri tarah chun kar dekhein.'));
}
var last = null, page = 0, newCount = 0;
async function run(kind) {
  if (busy) return;
  var more = !!(kind && last), q, s, c;
  if (more) { q = last.q; s = last.s; c = last.c; page++; }
  else { q = what.value.trim(); s = cleanSites(site.value); c = cat.value; page = 0; last = { q: q, s: s, c: c }; }
  if (!q) { statusEl.textContent = 'Pehle likhein ke kis cheez ka link chahiye.'; return; }
  var before = results.length;
  busy = true; q0 = q; $('tools').style.display = 'none';
  if (!more) { results = []; seen = {}; out.innerHTML = ''; }
  else if (kind === 'refresh') { results = []; out.innerHTML = ''; before = 0; } // purane hata do, seen yaad rakhta hai
  go.disabled = true; go.textContent = 'Dhoond raha hun...'; $('bar').style.display = 'block';
  $('refresh').disabled = true; $('fab').disabled = true; $('fab').classList.add('spinning');
  var jobs = [], pg = page, sites = s ? s.split(',') : [];
  var isYTs = function (d) { return /youtube\.com$|youtu\.be$/.test(d); };
  if (!more) ytNext = '';
  function J(label, type, query, st) { jobs.push({ label: label, fn: function () { return api(type, query, st, pg); } }); }
  if (pg > 0) {
    if (ytNext) J('YouTube ke aur videos', 'yt', q);
    sites.forEach(function (d) {
      if (!isYTs(d)) J(d + ' me aage ke pages', 'crawl', q, d);
      J(d + ' search (agla page)', 'web', 'site:' + d + ' ' + q, d);
    });
    if (!jobs.length) J('web search (agla page)', 'web', q);
  } else if (sites.length) {
    var ytDone = false;
    sites.forEach(function (d) {
      if (isYTs(d)) { if (!ytDone) { ytDone = true; J('YouTube search', 'yt', q); } }
      else { J(d + ' ko scan kar raha hun', 'crawl', q, d); J(d + ' ka sitemap', 'sitemap', q, d); J('Archive.org (' + d + ')', 'archive', q, d); }
      J(d + ' me search', 'web', 'site:' + d + ' ' + q, d);
    });
  } else {
    J('poore web me search', 'web', q);
    if (c === 'music' || c === 'video') J('YouTube search', 'yt', q);
    if (c === 'music') { J('Apple Music', 'itunes', q); J('official audio search', 'web', q + ' official audio'); }
    CATS[c].forEach(function (d) { J(d + ' me search', 'web', q + ' site:' + d); });
  }
  var done = 0, total = jobs.length, idx = 0, errs = [];
  function tick(l) { statusEl.textContent = 'Kaam ho raha hai (' + done + '/' + total + '): ' + l; $('fill').style.width = Math.round(done / total * 100) + '%'; }
  tick(jobs[0].label);
  async function worker() {
    while (idx < jobs.length) {
      var j = jobs[idx++];
      try { addResults(await j.fn()); } catch (e) { errs.push(j.label + ': ' + e.message); }
      done++; tick(j.label);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  $('bar').style.display = 'none';
  newCount = results.length - before;
  if (!results.length) {
    statusEl.textContent = '';
    if (kind === 'refresh' && !errs.length) out.appendChild(el('div', 'msg', 'Naya kuch nahi mila, sab pehle dikh chuke hain.\nThori der baad dobara Refresh karein ya YouTube ki tarteeb badal kar dekhein.'));
    else out.appendChild(el('div', 'msg', 'Koi link nahi mila.\n' + errs.slice(0, 4).join('\n') + '\nWorker address (⚙ link) aur internet check karein. Agar website blocked hai to VPN ya Android ka Private DNS (one.one.one.one) on karke dobara try karein.'));
  }
  go.disabled = false; go.textContent = '🔍 Dhoondo'; busy = false;
  $('refresh').disabled = false; $('fab').disabled = false; $('fab').classList.remove('spinning'); $('fab').style.display = 'block';
  if (results.length) render();
  if (more && results.length) statusEl.textContent = newCount ? newCount + (kind === 'refresh' ? ' naye links (purane hata diye). ' : ' naye links jude. ') + statusEl.textContent : 'Is baar koi naya link nahi mila (sab pehle se dikh chuke hain).';
}
Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function (b) {
  b.onclick = function () {
    mode = b.getAttribute('data-m');
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function (x) { x.classList.toggle('on', x === b); });
    if (results.length) render();
  };
});
$('cfg').onclick = function (e) { e.preventDefault(); askApi(); };
go.onclick = function () { run(); };
$('more').onclick = function () { run('more'); };
$('refresh').onclick = function () { run('refresh'); };
$('fab').onclick = function () { run('refresh'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
[what, site].forEach(function (i) { i.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); }); });
$('clr').onclick = function () { last = null; ytNext = ''; $('fab').style.display = 'none'; what.value = ''; site.value = ''; out.innerHTML = ''; statusEl.textContent = ''; results = []; seen = {}; $('tools').style.display = 'none'; what.focus(); };
$('copyAll').onclick = function () { copyText(visible().map(function (r) { return r.url; }).join('\n'), $('copyAll')); };
$('saveAll').onclick = function () {
  var txt = visible().map(function (r) { return r.title + '\n' + r.url + '\n'; }).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = 'links.txt'; document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
</html>
