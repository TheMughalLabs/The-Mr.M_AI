<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c16">
<title>Link Finder</title>
<style>
:root{--bg:#0a0c16;--tx:#e8eaf6;--mu:#8b90ab;--ln:rgba(255,255,255,.09);--cd:rgba(255,255,255,.045);--a:#8b5cf6;--b:#22d3ee;--ok:#34d399;--wn:#fbbf24;--er:#fb7185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--a);left:-15vmax;top:-20vmax}
.bg i:nth-child(2){background:var(--b);right:-20vmax;bottom:-25vmax;animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes inl{from{opacity:0;transform:translateX(-10px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes sh{to{background-position:-200% 0}}
.wrap{max-width:780px;margin:0 auto;padding:22px 14px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header>div:nth-child(2){flex:1}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 30px -8px var(--a)}
.logo .i{width:24px;height:24px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
.sub{color:var(--mu);font-size:13px;margin:0}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:14px;animation:up .5s both}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 6px 2px;letter-spacing:.3px}
.fld{position:relative;margin-bottom:12px}
main>section.card:first-of-type{position:relative;z-index:30}
.in{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border:1px solid var(--ln);border-radius:14px;padding:0 12px;color:var(--mu);transition:.2s}
.in:focus-within{border-color:var(--a);box-shadow:0 0 0 4px rgba(139,92,246,.18);color:var(--tx)}
.in input,.in select{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;padding:13px 0}
.in select option{background:#141830}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--tx);cursor:pointer;border:1px solid var(--ln);background:rgba(255,255,255,.06);border-radius:12px;padding:9px 13px;display:inline-flex;gap:7px;align-items:center;transition:transform .15s,background .2s,border-color .2s}
button:hover{background:rgba(255,255,255,.12)}button:active{transform:scale(.96)}button:disabled{opacity:.5;cursor:default}
.go{flex:1;justify-content:center;font-weight:600;border:0;padding:13px;background:linear-gradient(120deg,var(--a),var(--b));box-shadow:0 10px 28px -10px var(--a)}
.go:hover{filter:brightness(1.1);background:linear-gradient(120deg,var(--a),var(--b))}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#141830;border:1px solid var(--ln);border-radius:14px;overflow:hidden;z-index:20;box-shadow:0 20px 50px -10px #000;display:none}
.sug.on{display:block;animation:up .18s}
.sg{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.sg.sel,.sg:hover{background:rgba(139,92,246,.2)}
.sg b{color:var(--b)}.sg em{margin-left:auto;font-size:11px;color:var(--mu);font-style:normal}
.bar{height:3px;border-radius:3px;background:var(--ln);overflow:hidden;margin:-4px 0 14px;opacity:0;transition:.3s}
.bar.on{opacity:1}
.bar i{display:block;height:100%;width:0;transition:width .4s;background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200% 100%;animation:sh 1.2s linear infinite}
.logh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1s infinite}
.logh>span:nth-child(2){flex:1}
.logh button{padding:5px 8px;border-radius:9px}
.lg{font:12px/1.65 ui-monospace,Menlo,Consolas,monospace;max-height:220px;overflow:auto;margin-top:10px;transition:max-height .35s,margin .35s;scroll-behavior:smooth}
.logc.min .lg{max-height:0;margin:0}
.logc.min .logh button.tg .i{transform:rotate(180deg)}
.tg .i{transition:transform .3s}
.ln{display:flex;gap:8px;padding:1px 0;animation:inl .35s both;word-break:break-word}
.ln .t{color:var(--mu);flex:none}.ln .m{flex:1}
.ln .bd{flex:none;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;height:18px;margin-top:2px}
.ln.info .bd{background:rgba(139,144,171,.2);color:var(--mu)}
.ln.run .bd{background:rgba(34,211,238,.18);color:var(--b);animation:pulse 1s infinite}
.ln.ok .bd{background:rgba(52,211,153,.18);color:var(--ok)}
.ln.err .bd{background:rgba(251,113,133,.18);color:var(--er)}
.ln.warn .bd{background:rgba(251,191,36,.18);color:var(--wn)}
.empty{color:var(--mu)}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid var(--ln);border-radius:13px;padding:3px}
.seg button{border:0;background:none;padding:7px 11px;border-radius:10px;color:var(--mu)}
.seg button.on{background:linear-gradient(120deg,var(--a),var(--b));color:#fff}
.stat{color:var(--mu);font-size:13px;margin:0 2px 10px}
.cp{display:none;margin-bottom:12px}.cp.on{display:block;animation:up .3s}
.cp .g3{margin-bottom:10px}
.cp .in input,.cp .in select{padding:10px 0;font-size:14px}
.grp{margin-bottom:14px}
.grp h2{font-size:13px;color:var(--mu);margin:0 0 8px 4px;display:flex;gap:8px;align-items:center;font-weight:600}
.grp h2 small{background:rgba(255,255,255,.08);border-radius:20px;padding:0 8px;font-weight:500}
.item{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px;animation:up .45s both;transition:border-color .2s,transform .2s}
.item:hover{border-color:rgba(139,92,246,.5);transform:translateY(-1px)}
.t1{display:flex;gap:8px;align-items:flex-start;font-weight:600}
.kd{flex:none;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:3px;display:inline-flex;gap:4px;align-items:center}
.kd .i{width:11px;height:11px}
.kd.direct{background:rgba(52,211,153,.15);color:var(--ok)}.kd.category{background:rgba(251,191,36,.15);color:var(--wn)}
.sn{color:var(--mu);font-size:13px;margin:4px 0 0}
.u{display:block;color:var(--b);font-size:12px;margin:5px 0 8px;word-break:break-all;text-decoration:none;opacity:.85}
.bt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bt button,.bt a.bn{padding:6px 10px;font-size:13px;border-radius:10px}
a.bn{color:var(--tx);text-decoration:none;border:1px solid var(--ln);background:rgba(255,255,255,.06);display:inline-flex;gap:6px;align-items:center}
.src{margin-left:auto;font-size:11px;color:var(--mu)}
.msg{white-space:pre-wrap;color:var(--mu);text-align:center;padding:26px 10px;border:1px dashed var(--ln);border-radius:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-term" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
<symbol id="i-ref" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></symbol>
<symbol id="i-fold" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-tgt" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-sl" viewBox="0 0 24 24"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></symbol>
</defs></svg>
<div class="bg"><i></i><i></i></div>
<main class="wrap">
<header>
  <div class="logo"><svg class="i"><use href="#i-link"/></svg></div>
  <div><h1>Link Finder</h1><p class="sub">Har baar internet par asli, live search</p></div>
  <button id="cfg" title="Worker address"><svg class="i"><use href="#i-set"/></svg></button>
</header>

<section class="card">
  <div class="fld"><label>Kis cheez ka link chahiye?</label>
    <div class="in"><svg class="i"><use href="#i-search"/></svg><input id="what" placeholder="e.g. Tum Hi Ho Arijit Singh" autocomplete="off"></div></div>
  <div class="fld"><label>Website (sirf naam likhein, ek se zyada ho to comma lagayen)</label>
    <div class="in"><svg class="i"><use href="#i-globe"/></svg><input id="site" placeholder="e.g. y, git, spot..." autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="sug" id="sug"></div></div>
  <div class="g3" style="margin-bottom:12px">
    <div><label>Website na ho to</label><div class="in"><select id="cat"><option value="music">Song / Music</option><option value="video">Video</option><option value="code">Code / Software</option><option value="all">Sirf general web</option></select></div></div>
    <div><label>Kitne results</label><div class="in"><select id="cnt"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></div></div>
    <div><label>YouTube ki tarteeb</label><div class="in"><select id="sort"><option value="">Sab se munasib</option><option value="views">Zyada views</option><option value="date">Sab se naye</option><option value="rating">Best rating</option></select></div></div>
  </div>
  <div class="row"><button class="go" id="go"></button><button id="refresh" title="Purane hata kar sirf naye dikhao"></button><button id="clr"></button></div>
</section>
<div class="bar" id="bar"><i id="fill"></i></div>

<section class="card logc" id="logc">
  <div class="logh"><span class="dot" id="dot"></span><span>Live log</span><small id="lcount" style="color:var(--mu);font-weight:400"></small>
    <button id="lcopy" title="Log copy"><svg class="i"><use href="#i-copy"/></svg></button>
    <button id="lclr" title="Log saaf"><svg class="i"><use href="#i-trash"/></svg></button>
    <button class="tg" id="ltg" title="Chhupayen / dikhayen"><svg class="i"><use href="#i-chev"/></svg></button></div>
  <div class="lg" id="log"></div>
</section>

<section id="res" style="display:none">
  <div class="tb">
    <div class="seg" id="seg"><button data-m="direct" class="on"></button><button data-m="category"></button><button data-m="both">Dono</button><button data-m="custom"></button></div>
    <div class="row"><button id="addc"></button><button id="more"></button><button id="copyAll"></button><button id="saveAll"></button></div>
  </div>
  <div class="cp card" id="addp" style="animation:none">
    <div class="g3"><div class="in"><input id="ct" placeholder="Title (optional)"></div><div class="in"><input id="cu" placeholder="https://..."></div>
      <div class="in"><select id="ck"><option value="direct">Direct</option><option value="category">Category</option></select></div></div>
    <div class="row"><button id="caddb"></button></div>
  </div>
  <div class="cp card" id="cfp" style="animation:none">
    <div class="g3"><div class="in"><input id="f-inc" placeholder="In lafzon ka hona zaroori"></div><div class="in"><input id="f-exc" placeholder="Ye lafz na hon"></div>
      <div class="in"><input id="f-dom" placeholder="Website me ye likha ho"></div>
      <div class="in"><select id="f-src"></select></div>
      <div class="in"><select id="f-kind"><option value="">Direct + Category</option><option value="direct">Sirf Direct</option><option value="category">Sirf Category</option></select></div></div>
  </div>
  <p class="stat" id="stat"></p>
  <div id="out"></div>
</section>
</main>

<script>
var $ = function (i) { return document.getElementById(i); };
function ic(n) { return '<svg class="i"><use href="#i-' + n + '"/></svg>'; }
function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} return null; }
var API = '';
try { API = localStorage.getItem('lf_api') || ''; } catch (e) {}
function askApi() {
  var v = (prompt('Apne Cloudflare Worker ka address likhein\n(e.g. https://link-finder.aapka-naam.workers.dev)', API) || '').trim().replace(/\/+$/, '');
  if (v) { API = v; try { localStorage.setItem('lf_api', v); } catch (e) {} log('ok', 'Worker address save ho gaya'); }
}

/* ---------- icons on buttons ---------- */
function setB(id, icon, text) { $(id).innerHTML = ic(icon) + (text ? '<span>' + text + '</span>' : ''); }
setB('go', 'search', 'Dhoondo'); setB('refresh', 'ref', 'Naye'); setB('clr', 'x', 'Clear');
setB('addc', 'plus', 'Custom link'); setB('more', 'plus', 'Aur results'); setB('copyAll', 'copy', 'Copy all'); setB('saveAll', 'dl', '.txt'); setB('caddb', 'plus', 'Add karein');
$('seg').children[0].innerHTML = ic('tgt') + ' Direct'; $('seg').children[1].innerHTML = ic('fold') + ' Category'; $('seg').children[3].innerHTML = ic('sl') + ' Custom';

/* ---------- live log ---------- */
var logEl = $('log'), logN = 0;
function log(level, msg) {
  var d = el('div', 'ln ' + level), t = new Date().toTimeString().slice(0, 8);
  d.appendChild(el('span', 't', t)); d.appendChild(el('span', 'bd', { info: 'INFO', run: 'RUN', ok: 'OK', err: 'ERR', warn: 'WARN' }[level]));
  d.appendChild(el('span', 'm', msg));
  logEl.appendChild(d); logN++;
  while (logEl.children.length > 250) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight; $('lcount').textContent = logN + ' lines';
  return d;
}
function setLn(d, level, msg) {
  d.className = 'ln ' + level; d.children[1].textContent = { info: 'INFO', run: 'RUN', ok: 'OK', err: 'ERR', warn: 'WARN' }[level];
  d.children[2].textContent = msg; logEl.scrollTop = logEl.scrollHeight;
}
$('ltg').onclick = function () { $('logc').classList.toggle('min'); };
$('lclr').onclick = function () { logEl.innerHTML = ''; logN = 0; $('lcount').textContent = ''; };
$('lcopy').onclick = function () { copyText(Array.prototype.map.call(logEl.children, function (c) { return c.textContent; }).join('\n'), $('lcopy')); };

/* ---------- website autocomplete ---------- */
var DOM = ('youtube.com,youtu.be,google.com,facebook.com,instagram.com,twitter.com,x.com,tiktok.com,reddit.com,wikipedia.org,amazon.com,netflix.com,open.spotify.com,soundcloud.com,music.apple.com,jiosaavn.com,gaana.com,deezer.com,genius.com,audiomack.com,bandcamp.com,mixcloud.com,last.fm,azlyrics.com,musixmatch.com,dailymotion.com,vimeo.com,twitch.tv,github.com,gitlab.com,stackoverflow.com,npmjs.com,pypi.org,sourceforge.net,medium.com,quora.com,pinterest.com,linkedin.com,telegram.org,imdb.com,archive.org,wordpress.com,blogspot.com,tumblr.com,imgur.com,flickr.com,dropbox.com,mediafire.com,mega.nz,pixabay.com,unsplash.com,pexels.com,freepik.com,canva.com,udemy.com,coursera.org,khanacademy.org,w3schools.com,geeksforgeeks.org,tutorialspoint.com,mozilla.org,microsoft.com,apple.com,android.com,play.google.com,apkpure.com,apkmirror.com,uptodown.com,cnet.com,bbc.com,cnn.com,dawn.com,geo.tv,tribune.com.pk,thenews.com.pk,daraz.pk,olx.com.pk,pakwheels.com,zameen.com,rozee.pk,hamariweb.com,urdupoint.com,quran.com,islamicfinder.org,ebay.com,aliexpress.com,alibaba.com,etsy.com,booking.com,tripadvisor.com,yahoo.com,bing.com,duckduckgo.com,openai.com,claude.ai,huggingface.co,kaggle.com,fandom.com,goodreads.com,scribd.com,openlibrary.org,gutenberg.org,wattpad.com,webtoons.com,crunchyroll.com,ultimate-guitar.com,pornhub.com,xvideos.com,xnxx.com,xhamster.com,redtube.com,youporn.com,spankbang.com,eporner.com,tube8.com,tnaflix.com,thumbzilla.com,beeg.com,motherless.com,hclips.com,onlyfans.com,chaturbate.com,stripchat.com,brazzers.com,fansly.com').split(',');
var site = $('site'), what = $('what'), sug = $('sug'), sel = -1, cur = [];
function lastTok() {
  var v = site.value, i = Math.max(v.lastIndexOf(','), v.lastIndexOf(' '), v.lastIndexOf(';'));
  return { head: v.slice(0, i + 1), tok: v.slice(i + 1).trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '') };
}
function hideSug() { sug.classList.remove('on'); sel = -1; }
function suggest() {
  var t = lastTok().tok; sug.innerHTML = ''; sel = -1;
  if (!t) return hideSug();
  var h = ls('lf_sites') || [], sn = {}, a = [], b = [];
  h.concat(DOM).forEach(function (d) {
    if (sn[d]) return; sn[d] = 1;
    if (d.indexOf(t) === 0 || d.split('.')[0].indexOf(t) === 0 || d.replace(/^(open|music)\./, '').indexOf(t) === 0) a.push(d); else if (d.indexOf(t) > -1) b.push(d);
  });
  cur = a.concat(b).slice(0, 8);
  if (/\.[a-z]{2,}$/.test(t) && cur.indexOf(t) < 0) cur.unshift(t);
  if (!cur.length) return hideSug();
  cur.forEach(function (d, i) {
    var r = el('div', 'sg'), p = d.indexOf(t);
    r.innerHTML = ic('globe');
    var s = el('span'); if (p === 0) { s.appendChild(el('b', '', d.slice(0, t.length))); s.appendChild(document.createTextNode(d.slice(t.length))); } else s.textContent = d;
    r.appendChild(s); if (h.indexOf(d) > -1) r.appendChild(el('em', '', 'pehle use kiya'));
    r.addEventListener('pointerdown', function (e) { e.preventDefault(); pick(d); });
    sug.appendChild(r);
  });
  sug.classList.add('on');
}
function pick(d) { site.value = lastTok().head + d + ', '; hideSug(); site.focus(); }
function moveSel(n) { var k = sug.children; if (!k.length) return; if (k[sel]) k[sel].classList.remove('sel'); sel = (sel + n + k.length) % k.length; k[sel].classList.add('sel'); }
site.addEventListener('input', suggest);
site.addEventListener('focus', suggest);
site.addEventListener('blur', function () { setTimeout(hideSug, 120); });
site.addEventListener('keydown', function (e) {
  var on = sug.classList.contains('on');
  if (on && e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (on && e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (on && (e.key === 'Enter' || e.key === 'Tab') && sel > -1) { e.preventDefault(); pick(cur[sel]); }
  else if (e.key === 'Escape') hideSug();
  else if (e.key === 'Enter') { hideSug(); run(); }
});
function remember(list) { var h = ls('lf_sites') || []; list.forEach(function (d) { h = [d].concat(h.filter(function (x) { return x !== d; })); }); ls('lf_sites', h.slice(0, 30)); }

/* ---------- helpers ---------- */
function safe(u) { try { var x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x : null; } catch (e) { return null; } }
function cleanSite(s) { return s.trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').split(/[\/?#]/)[0].toLowerCase(); }
function cleanSites(v) { var o = []; v.split(/[\s,;]+/).forEach(function (x) { x = cleanSite(x); if (x && o.indexOf(x) < 0) o.push(x); }); return o.join(','); }
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { return ''; } }
function hostOk(u, s) { var h = hostOf(u); s = s.toLowerCase(); return h === s || h.endsWith('.' + s); }
function copyText(t, b) {
  var done = function () { var o = b.innerHTML; b.innerHTML = ic('check') + '<span>Copied</span>'; setTimeout(function () { b.innerHTML = o; }, 1300); };
  var fb = function () { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); };
  try { navigator.clipboard.writeText(t).then(done, fb); } catch (e) { fb(); }
}
function normKey(u) {
  try { var x = new URL(u); x.hash = ''; ['utm_source', 'utm_medium', 'utm_campaign', 'fbclid'].forEach(function (p) { x.searchParams.delete(p); });
    return hostOf(u) + x.pathname.replace(/\/$/, '') + x.search; } catch (e) { return u; }
}
var ytNext = '';
async function api(type, q, s, page) {
  var extra = '';
  if (type === 'yt') extra = '&count=' + $('cnt').value + '&sort=' + $('sort').value + (page > 0 && ytNext ? '&token=' + encodeURIComponent(ytNext) : '');
  else if (type === 'crawl' || type === 'archive' || type === 'sitemap') extra = '&count=' + $('cnt').value;
  if (!API) throw new Error('Worker address set nahi hai (upar settings button)');
  var r = await fetch(API + '/api/job?type=' + type + '&q=' + encodeURIComponent(q) + '&site=' + encodeURIComponent(s || '') + '&page=' + (page || 0) + extra + '&_=' + Date.now(), { cache: 'no-store' });
  var d = await r.json();
  if (d.error) throw new Error(d.error);
  if (type === 'yt') ytNext = d.next || '';
  return d.results;
}

/* ---------- results, filters, custom ---------- */
var results = [], seen = {}, busy = false, mode = 'direct', q0 = '', last = null, page = 0;
var customs = ls('lf_custom') || [], cf = { inc: '', exc: '', dom: '', src: '', kind: '' }, srcKey = '';
function addResults(list) {
  var n = 0;
  list.forEach(function (r) {
    if (!safe(r.url)) return;
    if (last && last.s && !last.s.split(',').some(function (d) { return hostOk(r.url, d); })) return;
    var k = normKey(r.url); if (seen[k]) return; seen[k] = 1; results.push(r); n++;
  });
  render(); return n;
}
function words() { return q0.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 1; }); }
function rank(r) { var h = (r.title + ' ' + r.url).toLowerCase(), n = 0; words().forEach(function (w) { if (h.indexOf(w) > -1) n++; }); return n + (r.kind === 'direct' ? 0.5 : 0); }
function sp(s) { return s.toLowerCase().split(/[\s,]+/).filter(Boolean); }
function passes(r) {
  if (r.custom && mode !== 'custom') return true;
  if (mode === 'direct' || mode === 'category') return r.kind === mode;
  if (mode === 'both') return true;
  var h = (r.title + ' ' + r.url + ' ' + (r.snippet || '')).toLowerCase();
  if (sp(cf.inc).some(function (w) { return h.indexOf(w) < 0; })) return false;
  if (sp(cf.exc).some(function (w) { return h.indexOf(w) > -1; })) return false;
  if (cf.dom && hostOf(r.url).indexOf(cf.dom.trim().toLowerCase()) < 0) return false;
  if (cf.src && r.source !== cf.src) return false;
  if (cf.kind && r.kind !== cf.kind) return false;
  return true;
}
function all() { return customs.concat(results); }
function visible() { return all().filter(passes); }
function card(r, i) {
  var c = el('div', 'item'); c.style.animationDelay = Math.min(i, 14) * 35 + 'ms';
  var tt = el('div', 't1'), k = el('span', 'kd ' + r.kind); k.innerHTML = ic(r.kind === 'direct' ? 'tgt' : 'fold') + (r.kind === 'direct' ? 'DIRECT' : 'CATEGORY');
  tt.appendChild(k); tt.appendChild(el('span', '', r.title || r.url)); c.appendChild(tt);
  if (r.snippet) c.appendChild(el('div', 'sn', r.snippet.slice(0, 200)));
  var a = el('a', 'u', r.url); a.href = r.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; c.appendChild(a);
  var b = el('div', 'bt'), o = el('a', 'bn'); o.href = r.url; o.target = '_blank'; o.rel = 'noopener noreferrer'; o.innerHTML = ic('ext') + 'Open';
  var cp = el('button'); cp.innerHTML = ic('copy') + 'Copy'; cp.onclick = function () { copyText(r.url, cp); };
  b.appendChild(o); b.appendChild(cp);
  if (navigator.share) { var sh = el('button'); sh.innerHTML = ic('share') + 'Share'; sh.onclick = function () { navigator.share({ title: r.title, url: r.url }).catch(function () {}); }; b.appendChild(sh); }
  if (r.custom) { var dl = el('button'); dl.innerHTML = ic('trash') + 'Hatayen'; dl.onclick = function () { customs.splice(customs.indexOf(r), 1); ls('lf_custom', customs); log('info', 'Custom link hata diya'); render(); }; b.appendChild(dl); }
  b.appendChild(el('span', 'src', r.source)); c.appendChild(b); return c;
}
function render() {
  var groups = {}, order = [], i = 0, vis = visible();
  $('res').style.display = (results.length || customs.length || mode === 'custom') ? 'block' : 'none';
  vis.sort(function (a, b) { return (b.custom ? 99 : rank(b)) - (a.custom ? 99 : rank(a)); }).forEach(function (r) {
    var d = r.custom ? 'Custom' : hostOf(r.url); if (!groups[d]) { groups[d] = []; order.push(d); } groups[d].push(r);
  });
  order.sort(function (a, b) { return a === 'Custom' ? -1 : b === 'Custom' ? 1 : groups[b].length - groups[a].length; });
  out.innerHTML = '';
  order.forEach(function (d) {
    var g = el('div', 'grp'), h = el('h2', '', d); h.appendChild(el('small', '', groups[d].length));
    g.appendChild(h); groups[d].forEach(function (r) { g.appendChild(card(r, i++)); }); out.appendChild(g);
  });
  var hidden = all().length - vis.length;
  $('stat').textContent = vis.length ? vis.length + ' links, ' + order.length + ' websites' + (hidden ? ' (' + hidden + ' chhupe hain)' : '') : '';
  if (!vis.length && !busy && all().length) out.appendChild(el('div', 'msg', 'Is filter me koi link nahi. "Dono" ya doosra filter chun kar dekhein.'));
  var srcs = {}; results.forEach(function (r) { srcs[r.source] = 1; });
  var key = Object.keys(srcs).join('|');
  if (key !== srcKey) { srcKey = key; var s = $('f-src'); s.innerHTML = ''; var o0 = el('option', '', 'Har source'); o0.value = ''; s.appendChild(o0);
    Object.keys(srcs).forEach(function (k) { var o = el('option', '', k); o.value = k; s.appendChild(o); }); s.value = cf.src; }
}
var out = $('out');
Array.prototype.forEach.call($('seg').children, function (b) {
  b.onclick = function () {
    mode = b.getAttribute('data-m');
    Array.prototype.forEach.call($('seg').children, function (x) { x.classList.toggle('on', x === b); });
    $('cfp').classList.toggle('on', mode === 'custom'); render();

});
[['f-inc', 'inc'], ['f-exc', 'exc'], ['f-dom', 'dom'], ['f-src', 'src'], ['f-kind', 'kind']].forEach(function (p) {
  $(p[0]).addEventListener('input', function () { cf[p[1]] = this.value; render(); });
});
$('addc').onclick = function () { $('addp').classList.toggle('on'); if ($('addp').classList.contains('on')) $('cu').focus(); };
$('caddb').onclick = function () {
  var u = $('cu').value.trim(); if (u && !/^[a-z]+:\/\//i.test(u)) u = 'https://' + u;
  if (!safe(u)) { log('warn', 'Custom link ka URL sahi nahi'); $('cu').focus(); return; }
  var r = { title: $('ct').value.trim() || hostOf(u), url: u, snippet: '', source: 'Custom', kind: $('ck').value, custom: true };
  customs.unshift(r); ls('lf_custom', customs); $('ct').value = ''; $('cu').value = ''; log('ok', 'Custom link add hua: ' + r.title); render();
};

/* ---------- search run ---------- */
async function run(kind) {
  if (busy) return;
  var more = !!(kind && last), q, s, c;
  if (more) { q = last.q; s = last.s; c = last.c; page++; }
  else { q = what.value.trim(); s = cleanSites(site.value); c = $('cat').value; page = 0; last = { q: q, s: s, c: c }; }
  if (!q) { log('warn', 'Pehle likhein ke kis cheez ka link chahiye'); what.focus(); return; }
  if (s) remember(s.split(','));
  var before = results.length; busy = true; q0 = q;
  if (!more) { results = []; seen = {}; ytNext = ''; } else if (kind === 'refresh') { results = []; before = 0; }
  ['go', 'refresh', 'more'].forEach(function (i) { $(i).disabled = true; });
  setB('go', 'search', 'Dhoond raha hun...'); $('dot').classList.add('on'); $('bar').classList.add('on'); $('fill').style.width = '4%';
  var jobs = [], pg = page, sites = s ? s.split(',') : [];
  var isYT = function (d) { return /youtube\.com$|youtu\.be$/.test(d); };
  function J(label, type, query, st) { jobs.push({ label: label, fn: function () { return api(type, query, st, pg); } }); }
  if (pg > 0) {
    if (ytNext) J('YouTube ke aur videos', 'yt', q);
    sites.forEach(function (d) { if (!isYT(d)) J(d + ' me aage ke pages', 'crawl', q, d); J(d + ' search (agla page)', 'web', 'site:' + d + ' ' + q, d); });
    if (!jobs.length) J('web search (agla page)', 'web', q);
  } else if (sites.length) {
    var yd = false;
    sites.forEach(function (d) {
      if (isYT(d)) { if (!yd) { yd = true; J('YouTube search', 'yt', q); } }
      else { J(d + ' scan', 'crawl', q, d); J(d + ' sitemap', 'sitemap', q, d); J('Archive.org: ' + d, 'archive', q, d); }
      J(d + ' me web search', 'web', 'site:' + d + ' ' + q, d);
    });
  } else {
    J('poore web me search', 'web', q);
    if (c === 'music' || c === 'video') J('YouTube search', 'yt', q);
    if (c === 'music') { J('Apple Music', 'itunes', q); J('official audio search', 'web', q + ' official audio'); }
    ({ music: ['open.spotify.com', 'soundcloud.com', 'jiosaavn.com', 'gaana.com', 'deezer.com', 'genius.com', 'audiomack.com'], video: ['dailymotion.com', 'vimeo.com', 'facebook.com', 'tiktok.com'], code: ['github.com', 'sourceforge.net', 'stackoverflow.com', 'npmjs.com', 'pypi.org'], all: [] }[c]).forEach(function (d) { J(d + ' me search', 'web', q + ' site:' + d); });
  }
  log('info', (more ? 'Aur results: ' : 'Nayi search: ') + '"' + q + '"' + (s ? ' | ' + s : '') + ' | ' + jobs.length + ' kaam');
  var done = 0, idx = 0, errs = 0, t00 = Date.now();
  async function worker() {
    while (idx < jobs.length) {
      var j = jobs[idx++], ln = log('run', j.label + ' ...'), t0 = Date.now();
      try { var n = addResults(await j.fn()); setLn(ln, 'ok', j.label + ': ' + n + ' naye links (' + ((Date.now() - t0) / 1000).toFixed(1) + 's)'); }
      catch (e) { errs++; setLn(ln, 'err', j.label + ': ' + (/Failed to fetch|NetworkError/i.test(e.message) ? 'Worker se rabta nahi hua (address / internet check karein)' : e.message)); }
      done++; $('fill').style.width = Math.max(4, Math.round(done / jobs.length * 100)) + '%';
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  var added = results.length - before;
  log(added ? 'ok' : 'warn', 'Mukammal: ' + added + ' naye links, ' + errs + ' error, ' + ((Date.now() - t00) / 1000).toFixed(1) + 's');
  if (!results.length) {
    out.innerHTML = ''; $('res').style.display = 'block';
    out.appendChild(el('div', 'msg', 'Koi link nahi mila.\nLog me dekhein kaun sa kaam fail hua. Blocked website ho to VPN ya Android Private DNS (one.one.one.one) on karke dobara try karein.'));
  }
  busy = false; $('dot').classList.remove('on'); setTimeout(function () { $('bar').classList.remove('on'); }, 500);
  ['go', 'refresh', 'more'].forEach(function (i) { $(i).disabled = false; }); setB('go', 'search', 'Dhoondo');
  if (results.length) render();
}
$('go').onclick = function () { run(); };

what.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });

$('copyAll').onclick = function () { copyText(visible().map(function (r) { return r.url; }).join('\n'), $('copyAll')); };
$('saveAll').onclick = function () {
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([visible().map(function (r) { return r.title + '\n' + r.url + '\n'; }).join('\n')], { type: 'text/plain' }));
  a.download = 'links.txt'; document.body.appendChild(a); a.click(); a.remove();
};
log('info', 'Tayyar hun. ' + (API ? 'Worker: ' + API : 'Pehle upar settings button se Worker address set karein.'));
